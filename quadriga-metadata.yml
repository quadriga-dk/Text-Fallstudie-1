  url: https://quadriga-dk.github.io/Text-Fallstudie-1/corpus_processing/corpus-processing_intro.html
  timeRequired: PT60M
  learningGoal: Korpusverarbeitung mit Natural Language Processing
  learningObjectiveLIST:
