description: Dieses interaktive Lehrbuch vermittelt Methoden für die automatische
  Erstellung, Aufbereitung und Analyse eines Textkorpus. Im Zentrum steht die Frage,
  wie sich die mediale Aufmerksamkeit auf die Spanische Grippe in zeitgenössischen
  Berliner Zeitungen verändert. Der Fokus des Lehrbuchs liegt auf der Korpuserstellung
  mittels Optical Character Recognition (OCR) mit pytesseract. Das Lehrbuch ist in
  sechs Kapitel aufgeteilt. Es wird zuerst in die Fragestellung und deren Operationalisierung
  eingeführt, dann werden Methoden des Korpusaufbaus beschrieben. Danach wird in die
  Methode der OCR sowie in die Nachbereichtung des Outputs eingeführt. Das Textkorpus
  wird dann mit spacy lemmatisiert und schlussendlich wird eine diachrone Frequenzanalyse
  auf dem annotierten Korpus ausgeführt.
tableOfContents: '- Einstieg

  - Fragestellung und Operationalisierung. Einführung in die Fallstudie

  - Korpusaufbau. Auswählen, sammeln, dokumentieren

  - OCR. Von Bild zu Text

  - OCR-Nachbearbeitung: manuell, automatisch, LLMs

  - Korpusverarbeitung. Von Strings zu Token

  - Korpusanalyse. Von Häufigkeiten zu Diagrammen

  - Reflexion

  - Abschluss'
